<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Base path for Flutter Web -->
  <base href="$FLUTTER_BASE_HREF">

  <!-- App Title -->
  <title>GiftPay – Smart Payments</title>

  <!-- Description (SEO) -->
  <meta name="description" content="GiftPay – Fast, secure payments for electricity, airtime, data, and wallet services.">

  <!-- Keywords (SEO) -->
  <meta name="keywords" content="GiftPay, payments, electricity, airtime, data, wallet, fintech">

  <!-- Social Preview -->
  <meta property="og:title" content="GiftPay – Smart Payments">
  <meta property="og:description" content="Fast, secure payments for electricity, airtime, data, and wallet services.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:type" content="website">

  <!-- Force HTML Renderer -->
  <meta name="flutter-web-renderer" content="html">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GiftPay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Android PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Paystack Web Popup -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <!-- Disable caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style id="splash-screen-style">
    html { height: 100% }
    body {
      margin: 0;
      min-height: 100%;
      background-color: #000000;
      background-size: 100% 100%;
    }
    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

</head>

<body>
  <picture id="splash">
    <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
    <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
    <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
